name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to ACR
      uses: azure/docker-login@v1
      with:
        login-server: hotelappacr.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t hotelappacr.azurecr.io/hotel-backend:${{ github.sha }} ./backend
        docker push hotelappacr.azurecr.io/hotel-backend:${{ github.sha }}

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Get AKS credentials
      run: |
        az aks get-credentials --resource-group hotel-management-rg --name hotel-aks

    - name: Deploy to AKS
      run: |
        kubectl set image deployment/hotel-backend hotel-backend=hotelappacr.azurecr.io/hotel-backend:${{ github.sha }}
        kubectl rollout status deployment/hotel-backend
